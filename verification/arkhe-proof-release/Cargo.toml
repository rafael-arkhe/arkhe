[workspace]
resolver="2"
members=["kernel/arkhe-core", "integration/auth-md", "verification/crates/arkhe-verify-core", "verification/crates/arkhe-verify-wasm", "kernel/arkhe-kernel", "governance/arkhe-governance", "cognition/arkhe-agent", "cognition/arkhe-cognition-sdk", "host-dispatch"]

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
ed25519-dalek = "2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros","rt-multi-thread","sync","time","fs"] }
uuid = { version = "1", features = ["v4","serde"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
axum = "0.8"

clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
wasm-bindgen = "0.2"
