[workspace]
members = [
    "crates/arkhe-core",
    "crates/arkhe-identity",
    "crates/arkhe-governance",
    "crates/arkhe-pea",
    "crates/arkhe-memory",
    "crates/arkhe-inference",
    "crates/arkhe-session-evaluator",
    "crates/arkhe-reflector-agent",
    "crates/arkhe-agi",
    "crates/arkhe-cli",
    "crates/arkhe-lean-spec-derive",
    # ✅ F2: 8 crates novos de segurança AISVS
    "crates/arkhe-rate-limit",
    "crates/arkhe-bom",
    "crates/arkhe-prompt-detector",
    "crates/arkhe-hallucination",
    "crates/arkhe-rsi-core",
    "crates/arkhe-rsi",
    "crates/arkhe-web3-security",
    "crates/arkhe-crypto-pqc",
    "crates/arkhe-pqc-core",
    "crates/arkhe-agent-vm",
    "crates/arkhe-evidence",
    "crates/arkhe-network",
    "crates/arkhe-reasoning",
    "crates/arkhe-health-check",
    "crates/arkhe-storage",
    "crates/arkhe-nostr-anchor",
    # TEMPORARILY DISABLED 2026-09-14 (AutoCoder triage): `crates/arkhe-buzz`
    # exists as a directory but has no Cargo.toml -- its only file is an
    # untracked `src/bin/arkhe-buzz-server.rs`, hidden from `git status` by the
    # global `bin/` ignore rule. A member without a manifest makes every cargo
    # command fail to load the workspace, so it is disabled on the same terms
    # as the entries below. Re-enable when the crate exists, or delete the
    # entry.
    # "crates/arkhe-buzz",
    # TEMPORARILY DISABLED 2026-09-14 (AutoCoder triage): declared but absent on
    # disk -- never committed in any branch, and no source file in the tree
    # references them. Re-enable when the crate exists, or delete the entry.
    # "crates/arkhe-buzz-relay",
    "crates/arkhe-blossom",
    # "crates/arkhe-web-gateway",
    "crates/arkhe-geometric-verifier",
    # "crates/arkhe-mcp-server",
    "crates/arkhe-orcid",
    # "crates/arkhe-security",
    # "crates/arkhe-change",
    # ✅ Plano Arkhe OS — §1.5 (Fase 1.5) grafo causal, §2.1–2.3 (Fase 2) verificação client-side em WASM
    "crates/arkhe-wormgraph",
    "crates/arkhe-verify-wasm",
    # ✅ §2.3 — a segunda casca do core do `arkhe-verify-wasm`: as cinco
    # verificações com tipos nativos, o modelo Rekor/CT e o adaptador HTTP.
    # Nativo de propósito — não é dependência do alvo wasm.
    "crates/arkhe-verify",
    # ✅ Registro dos dois crates órfãos: tinham tabela [workspace] própria
    # (vestigial — a premissa "o raiz não resolve" está obsoleta, as entradas
    # ausentes antigas já estão comentadas acima) e agora são membros.
    "crates/arkhe-tee",
    "crates/arkhe-event-bus",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Arkhe OS Architects <arkhe@arkhe-os.org>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/arkhe-os/arkhe"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.0", features = ["alloc"] }
blake3 = "1.5"
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"
bech32 = "0.11"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
getrandom = "0.2"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "fs", "process"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3.10"
clap = { version = "4.5", features = ["derive"] }
strsim = "0.11"
regex = "1"
dashmap = "5.5"
futures = "0.3"
sled = { version = "0.34" }
rmp-serde = { version = "1.3" }
mistralrs = { version = "0.8" }
candle-core = { version = "0.10.2" }
candle-nn = { version = "0.10.2" }
candle-transformers = { version = "0.10.2" }
llama-cpp-2 = { version = "0.1" }
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
# ✅ F3: Dependências faltantes adicionadas
unicode-normalization = "0.1"
wasmtime = { version = "28.0" }
# ✅ F1: ed25519-dalek v2.2.0 — API v2.x (SigningKey, não Keypair)
ed25519-dalek = { version = "2.2" }
zeroize = { version = "1.8" }
# ✅ GDID: comparação constant-time + Base58Check
subtle = "2.6"
bs58 = "0.5"
serde-big-array = "0.5"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
