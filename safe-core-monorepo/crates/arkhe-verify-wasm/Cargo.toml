[package]
name = "arkhe-verify-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Plano Arkhe OS §2.1–2.3 — verificação client-side que carrega no navegador: SHA-256, Ed25519 contra trust root, inclusão Merkle RFC 6962, quórum de witnesses e pipeline de atestação, expostos via wasm-bindgen"
license.workspace = true
repository.workspace = true

# `cdylib` é o artefato que o navegador carrega (via wasm-bindgen);
# `rlib` permite que os testes rodem nativos, sem wasm.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.11"
ed25519-dalek = "2.1"
base64 = "0.22"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
ct-merkle = "0.3.0"
