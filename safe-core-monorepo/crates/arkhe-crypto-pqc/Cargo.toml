[package]
name = "arkhe-crypto-pqc"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Hybrid post-quantum cryptography (ML-DSA-65 + Ed25519, ML-KEM-1024) for Arkhe Web3 security"
license.workspace = true
repository.workspace = true
keywords = ["pqc", "post-quantum", "ml-dsa", "ml-kem", "cryptography"]
categories = ["cryptography"]

[dependencies]
fips204 = "0.4"
fips203 = "0.4"
ed25519-dalek = { workspace = true, features = ["rand_core"] }
zeroize = { workspace = true, features = ["derive"] }
hkdf = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }

