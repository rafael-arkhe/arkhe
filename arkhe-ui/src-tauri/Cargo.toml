[package]
name = "arkhe-ui-app"
# 0.2.2 e não 0.2.1: o binário passa a trazer os `relays` declarados no
# `tauri.conf.json`, o que muda o conjunto de relays de que a resolução da raiz
# depende — é uma mudança de comportamento observável, não de forma. O 0.2.0
# levava o plugin integrado mas nenhum código a invocá-lo (`guest-js` não
# copiado); o 0.2.1 trouxe a interface de consulta e a cola que a liga; o 0.2.2
# acrescenta `relays` e **não** `blossomServers` (a razão, com a medição, está no
# `README.md` deste directório). A versão declarada tem de mudar com o binário.
#
# A ordem importa e não é estética: `tauri.conf.json` é lido em tempo de
# **compilação** pelo `generate_context!`, e é de lá (`package_info().version`)
# que o plugin lê a versão corrente. Um binário compilado antes do bump
# dir-se-ia 0.2.1 estando publicado como 0.2.2 — e oferecer-se-ia a si próprio
# como actualização, para sempre. Por isso o bump vem antes do build.
#
# `Cargo.toml`, `tauri.conf.json` e o manifesto do release levam a mesma versão,
# juntos: três sítios, um número.
#
# 0.2.3 e não 0.2.2: o binário do 0.2.2 **abortava**. Com as features `ring` e
# `aws_lc_rs` do `rustls` ligadas ao mesmo tempo, `CryptoProvider::
# from_crate_features()` devolve `None` e o `expect` de
# `get_default_or_install_from_crate_features` (`rustls-0.23.45/src/crypto/
# mod.rs:249`) mata o processo — e `panic = "abort"` no perfil de release faz
# disso morte instantânea, sem `catch_unwind` possível. O clique no botão do
# updater abortava a app, e o mesmo pânico foi observado no arranque sem
# clique. A correcção é instalar o provedor explicitamente no topo do `run()`;
# a causa longa, com a prova crua, está no doc-comment de `run` em `src/lib.rs`.
version = "0.2.3"
edition = "2021"
description = "Plano Arkhe OS §Fase 5 — o casco Tauri: a app de verificação como aplicativo instalável, ligado ao núcleo nativo de verificação (arkhe-verify)"
authors = ["Arkhe OS Architects <arkhe@arkhe-os.org>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/arkhe-os/arkhe"

# Workspace próprio, deliberadamente.
#
# O `Cargo.toml` da raiz deste repositório declara um `[workspace]` (o do
# kernel) que **não** inclui este pacote. O cargo sobe a árvore a partir daqui,
# encontra esse workspace e recusa o pacote como membro implícito — a tabela
# vazia abaixo faz deste diretório a raiz do seu próprio workspace, que é o que
# uma app Tauri é. Efeito colateral desejado: o `Cargo.lock` da app fica
# separado do lock da raiz, o que é correto — são duas árvores de dependências
# diferentes, com versões de `serde` diferentes (a raiz usa 1.0 solto, o
# `safe-core-monorepo` tem o seu).
[workspace]

[lib]
# O entrypoint real vive na biblioteca (e não no `main.rs`) porque o macro
# `tauri::generate_context!` precisa de ser compilado como parte de um crate
# com nome estável — é também o que a organização de uma app Tauri v2 espera.
name = "arkhe_ui_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Versões fixadas no registo (medidas com `cargo info`, não presumidas):
# `tauri` 2.11.5 é o stable; `3.0.0-alpha.0` existe e **não** é usado aqui.
tauri-build = { version = "2.6.3", features = [] }
# O mesmo `embed-resource` que o `tauri-build` já usa por baixo do `tauri-winres`
# (3.0.11 no lock), agora chamado directamente: é ele que sabe compilar um
# *Windows Resource* e emitir o `cargo:rustc-link-arg-tests=` que falta aos
# testes. Não acrescenta código novo à árvore — só uma aresta directa para uma
# dependência que já lá está. Ver `build.rs`.
embed-resource = "3"

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
# O núcleo de verificação. Caminho relativo a **este** directorio
# (`arkhe-ui/src-tauri/`), ou seja, dois níveis acima da app: `arkhe-ui/` →
# raiz do repo → `safe-core-monorepo/crates/arkhe-verify`.
#
# Dependência de **caminho**, não de registo: o crate não é publicado, e a
# app tem de verificar com o mesmo código que o `arkhe-verify-wasm` compila
# para wasm — as duas cascas sobre o mesmo core.
arkhe-verify = { path = "../../safe-core-monorepo/crates/arkhe-verify" }
# A actualização in-app (Opção D). Versão **medida no registo**, não presumida:
# `cargo info tauri-plugin-hashtree-updater` → 0.2.52 é a última publicada (a
# série começa em 0.2.45). Depende de `tauri = "2"`, portanto casa com o
# 2.11.5 desta app; não obriga a mexer na versão do Tauri.
#
# Fixar a série em `0.2` e não em `=0.2.52`: o plugin é do mesmo autor e do
# mesmo ciclo do `htree` 0.2.51 que publica os releases, e um pin exacto
# impediria um patch que corrija o resolvedor. O `Cargo.lock` desta app (que é
# próprio — ver o comentário do `[workspace]`) é que congela o que é compilado.
tauri-plugin-hashtree-updater = "0.2.52"
# O `rustls`, para **nomear** o provedor criptográfico em vez de o adivinhar.
#
# A árvore tem hoje dois provedores ligados ao mesmo `rustls 0.23.45`, por
# unificação de features, e é isso que arma o pânico:
#
#   arkhe-verify      (dep de caminho)         → reqwest/rustls   → hyper-rustls/aws-lc-rs
#   hashtree-blossom  (pelo plugin updater)    → rustls-tls-webpki-roots → hyper-rustls/ring
#
# `CryptoProvider::from_crate_features()` (privada) só responde quando
# **exactamente uma** das features `ring`/`aws_lc_rs` está ligada
# (`rustls-0.23.45/src/crypto/mod.rs:260-300`, os blocos `#[cfg(all(...,
# not(feature = ...)))]`); com as duas, devolve `None`, e quem fica com o `None`
# é o `expect` da linha 249. Ninguém instala o provedor: a única chamada a
# `install_default()` na árvore é a do `tauri`, em
# `tauri-2.11.5/src/protocol/tauri.rs:45`, e ela está dentro de um bloco
# `#[cfg(all(dev, mobile))]` **e** de um `#[cfg(feature = "rustls-tls")]` — num
# binário de release de desktop não existe, e a feature `rustls-tls` do `tauri`
# nem sequer está ligada (o `tauri` não aparece na árvore de features do
# `rustls`). A conclusão de uma rodada anterior de que "é o runtime do Tauri que
# o instala" é, medidamente, falsa para esta plataforma.
#
# **`default-features = false` não é estilo, é a condição de o efeito ser
# mínimo.** O `default` do `rustls` é
# `[aws_lc_rs, logging, prefer-post-quantum, std, tls12]`
# (`rustls-0.23.45/Cargo.toml:70-76`), e `logging` e `prefer-post-quantum`
# **não** estão ligadas hoje. Pedir o `default` ligaria as duas — incluindo
# `prefer-post-quantum = ["aws_lc_rs"]`, que muda a negocição TLS da app. Com
# `default-features = false, features = ["ring"]` a aresta só pede `ring`, que
# já vem pedida pelo `reqwest`/`hyper-rustls`; as features são aditivas em
# Cargo, portanto o conjunto unificado não muda (medido, antes/depois, com
# `cargo tree -e features -i rustls`). O que muda é a escolha passar a estar
# **escrita** neste ficheiro em vez de depender de quem a pede por baixo.
#
# E é `ring` e não `aws-lc-rs` porque é `ring` que a cadeia nova já traz: o
# `aws-lc-rs` obrigaria a rever a árvore do `arkhe-verify`, que é código
# verificado. Uma linha, e reversível.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# `serde_json` era só `[dev-dependencies]` até esta fase; passa a dependência
# normal **por causa do plugin**, e o erro que o obriga é literal:
#
#   error[E0433]: failed to resolve: could not find `serde_json`
#      --> src\lib.rs  .run(tauri::generate_context!())
#
# O `generate_context!` lê o `tauri.conf.json` e, para cada chave de `plugins`,
# desserializa a configuração para o `Config` do plugin correspondente. Com o
# `plugins.hashtree-updater` declarado, o macro passa a expandir código que
# chama `serde_json::from_str` **a partir do crate raiz desta app** — e o crate
# raiz não tinha `serde_json`. Sem a secção `plugins` o caminho não existia, por
# isso o erro só apareceu agora.
#
# A entrada de `[dev-dependencies]` sai: as duas tabelas unificam para o mesmo
# crate, e mantê-la seria declarar a mesma dependência duas vezes.
serde_json = "1"

[dev-dependencies]
# `tauri` com a feature `test` — é ela que abre `tauri::test` (`src/test/mod.rs`,
# com o `pub mod test` em `tauri-2.11.5/src/lib.rs:1100` guardado por
# `#[cfg(any(test, feature = "test"))]`). Traz o `MockRuntime`, que não tem
# janela, sessão gráfica nem event loop, e a única entrada pública para o
# **despacho** de um comando: `get_ipc_response`, que constrói um
# `InvokeRequest`, chama `Webview::on_message` e devolve o `InvokeResponse` já
# resolvido.
#
# A feature fica **aqui**, e não em `[dependencies]`, de propósito: `test = []` é
# uma feature vazia (não acrescenta crates), mas expor `tauri::test` no binário
# de produção não é aceitável. `cargo check` do binário continua a ver o `tauri`
# sem ela; só os alvos de teste é que unificam a feature.
#
# `serde_json` é o que o IPC é no fio: o corpo do pedido chega como
# `InvokeBody::Json(Value)`, e `get_ipc_response` devolve o canal de erro como
# `Value`. Sem ele os testes teriam de importar o `serde_json` do `tauri` por um
# caminho interno (`tauri::ipc` não o reexporta).
#
# Já **não** é declarado aqui: passou a `[dependencies]` (ver a nota nessa
# tabela — o `generate_context!` precisava dele no crate raiz desde que há
# `plugins`). Uma dependência normal serve também os alvos de teste, portanto
# uma segunda entrada nesta tabela seria a mesma dependência escrita duas vezes.
tauri = { version = "2.11.5", features = ["test"] }

# Perfil de release de uma app distribuível: um binário só, sem símbolos, e o
# menor possível. `panic = "abort"` é seguro aqui — nada nesta app depende de
# `catch_unwind`, e o webview não sobrevive a um panic de qualquer forma.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
