[workspace]
resolver = "2"
members = [
    # Core PQC + identity
    "packages/arkhe-pqc",
    "packages/identity",
    # Timechain ecosystem (MHD -> Shadow -> Timechain)
    "packages/arkhe-mhd",
    "packages/arkhe-shadow",
    "packages/arkhe-svd",
    "packages/arkhe-timechain",
    # Hypergraph engine + Nostr attestation
    "packages/arkhe-hypergraph",
    "packages/arkhe-nostr",
    # Neurogenesis / actuators / Buzz bridge
    "packages/arkhe-neurogenesis",
    "packages/arkhe-recurrency",
    "packages/arkhe-recurrency-temporal",
    "packages/arkhe-recurrency-daemon",
    "packages/arkhe-thz-sensor",
    "packages/arkhe-buzz-bridge",
    "packages/arkhe-actuators",
    # Ionospheric ray tracing (Haselgrove / OT 75-76) — no_std, C4
    "packages/arkhe-haselgrove",
    # DTN agent for deep-space data relay
    "packages/arkhe-ia-dtn", "packages/arkhe-buzz",
    # 491-AGI-CORTEX service stack
    "services/safe-core",
    # Telegraph ξM-field observability bridge (Chladni Cloud / Cathedral v26.5 dashboard)
    "packages/arkhe-observability",
    # Phase-field XY/Kuramoto lattice models (Cathedral V8.6 NxN skyrmion mesh)
    "packages/arkhe-xy-simulator",
    # AVALON v2.3 — distributed AGC controller + Safe-Core evidence (Fase 2/3)
    "packages/arkhe-avalon-agc",
    # AVALON v2.3 — PyO3 bridge (feature-gated: needs no CPython for CI check)
    "packages/arkhe-avalon-bridge",
    # ARKHE-VSEPR 2026-09-09 — núcleo Rust 1 (topologia, reputação, OAM, tokenização,
    # incentivos, DID, cristalografia)
    "packages/arkhe-topology",
    "packages/arkhe-reputation",
    "packages/arkhe-oam",
    "packages/arkhe-tokenization",
    "packages/arkhe-incentives",
    "packages/arkhe-did",
    "packages/arkhe-crystallography",
    # ARKHE-VSEPR 2026 — núcleo Rust 2 (Field 1.0: X(2370)/BESIII, VSEPR-glueball,
    # JUNO Nature 654, matriz de mistura de camadas, amalgam G3/arXiv:2607.27256)
    "packages/arkhe-field",
    "packages/arkhe-ecdsa-mitm",
    # ARKHE-VSEPR 2026 — núcleo Rust 3 (Sete Selos de agosto de 2026: gap C-Z,
    # qhttp UHSVT, Tzinor quantum switch ICO)
    "packages/arkhe-gap",
    "packages/arkhe-qhttp",
    "packages/arkhe-tzinor",
    # ARKHE-χ SafeManifold — security state projection with constitutional invariants
    "packages/arkhe-safe-manifold",
    # Catedral OS v152.0 — materialização física: undulator (I194–I198), Z1T
    # bridge, sincronização IPFS distribuída (I201), verificação Lean embarcada (I200)
    "packages/arkhe-catedral-v152",
    # 924-POTT-INTERPLANETARY-TRANSPORT — Proof-of-Transit Timestamping (arXiv:2508.20591)
    "packages/arkhe-pott",
    # ARKHE-BITCOIN — Geração de chaves/endereços Bitcoin (P2PKH/P2WPKH/P2TR, WIF)
    "packages/arkhe-bitcoin",
    # ARKHE-FIELD-STABILITY — Estabilidade de campo, qualidade e stub MCP (reqwest).
    # Substitui o arkhe-mcp-client externo (ADR-001); renomeado de arkhe-safe-core
    # para não colidir com services/safe-core (watchdog anti-alucinação 491-AGI-CORTEX).
    "packages/arkhe-field-stability",
    # ARKHE-FIRMWARE-CONSCIOUSNESS — Governança de consciência no_std para
    # dispositivos embarcados (C-01..C-04, Φ inteiro Gap-1, watchdog, CBOR).
    "packages/arkhe-firmware-consciousness",
    # ARKHE-LEAN-BRIDGE — Ponte Lean↔Rust (v494.1 real): kernel Lean 4.33.1
    # como único ponto de confiança (FFI forte), fingerprints SHA3-256 (Ghost-1)
    # e critérios de falsificação F1–F6 (núcleo I524–I529, bloco proposto 1009).
    "packages/arkhe-lean-bridge",
    # ARKHE-ORCHESTRATOR-GATE — Gate mínimo real de orquestração (bloco 1010,
    # v390.1): autorização de passo só com veredito verified do kernel Lean
    # (arkhe-lean-bridge) E Φ na banda Gap-1 conservadora (5774, 9999]
    # (arkhe-field-stability); contenção contabilística commits ≤ provas
    # (I535-A); trilha auditável via CoherenceLedger real (I534/I535). Núcleo
    # Lean core em src/lean/OrchestratorGateNucleus.lean.
    "packages/arkhe-orchestrator-gate",
    # ARKHE-GPU — Camada GPU da Catedral (bloco 1011, v390.2): governança de
    # lançamentos (banda G-07 threads≤1024, grid≤2³¹−1; capas Tile 5 s e SIMT
    # 10 s), auditoria append-only com contenção contabilística (I537) e
    # MockGpuBackend testável sem hardware (Mutex<HashMap>, zero unsafe).
    # Núcleo Lean core I536/I537/I538 em src/lean/GpuInvariantsNucleus.lean.
    # Track real Tile (feature `tile`, crate `cutile`) e SIMT (feature `simt`)
    # off por default — nenhuma compila neste ambiente (sm_75<sm_80,
    # CUDA 12.1<13.3, Windows).
    "packages/arkhe-gpu",
    # ARKHE-BLINK-BRIDGE — Consolidação tripla MEV + ANTH + ARKHE (bloco 1052,
    # v530.0): UnifiedBlinkBridge aplica 16 invariantes em sequência
    # (MEV-001..006, ANTH-001..006, I619/I622/I623/I624). Self-contained
    # (nenhum crate fictício), zero unsafe, única dep sha3 (workspace). Backend
    # Blink simulado em memória (digest SHA3-256 determinístico); a ponte real
    # de assinatura pertence ao substrato 972-ARKHE-BITCOIN.
    "packages/arkhe-blink-bridge",
    # ARKHE-P2P — Camada P2P da Catedral (bloco 1055, decisão de transporte):
    # libp2p 0.56.0 PINADO (MSRV 1.83.0, auditado e compilado no rustc 1.94.0),
    # identidade Ed25519 (PeerId), mensagens assinadas (sign/verify + antireplay)
    # e rede real Kademlia + gossipsub + identify. Núcleo testável sem malha
    # multi-nó (convenção de honestidade dos blocos 1052/1054).
    "packages/arkhe-p2p",
    # ARKHE-INVARIANT-REGISTRY — Registry canónico de invariantes (bloco 1057
    # ratificado): IDs atestados apenas por realização testada; referências sem
    # substrato são rejeitadas (nunca geram renomeações); I625+ ficam livres.
    # Política em docs/namespace_policy.md.
    "packages/arkhe-invariant-registry",
]

[workspace.package]
version = "35.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Criptografia PQC verificada formalmente (libcrux)
libcrux-ml-dsa = "0.0.4"

# Derivação de chaves
hkdf = "0.12"
sha3 = "0.10"
zeroize = { version = "1.7", features = ["derive"] }

[profile.release]
lto = true
opt-level = 3
strip = "symbols"
