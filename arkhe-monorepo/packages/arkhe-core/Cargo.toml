[package]
name = "arkhe-core"
version = "0.3.3"
edition = "2021"
description = "arkhe-core — pure transition (State/Event/apply) + append-only hash-chained ledger (Ghost-1). v0.3.3: Ledger 95-byte canonical layout, event_kind ASCII <= 23 by construction (private fields + serde try_from, D2), compute_hash()/verify()/last_hash() fail-closed (D1/D4), append() validates before mutating (D3), blake3 over explicit little-endian bytes. Deps: serde/thiserror (workspace), blake3, hex; serde_json so dev-only."
license = "MIT OR Apache-2.0"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
blake3 = "1"
hex = "0.4.3"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "deny"