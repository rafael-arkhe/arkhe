# ARKHE-GPU — Camada GPU da Catedral (bloco 1011, v390.2): governança,
# auditoria e mock testável da camada GPU. Núcleo Lean core I536/I537/I538 em
# src/lean/GpuInvariantsNucleus.lean.
[package]
name = "arkhe-gpu"
version = "0.1.0"
edition = "2021"
description = "Camada GPU da Catedral (bloco 1011, v390.2): governança de lançamentos (banda G-07 threads≤1024, grid≤2³¹−1; capas Tile 5 s e SIMT 10 s), auditoria append-only com contenção contabilística (I537) e MockGpuBackend testável — sem hardware, sem `unsafe`, sem deps externas novas (Simplicity-2). Track real Tile (crate `cutile`, feature `tile`) e SIMT (feature `simt`) off por default; nenhuma das tracks compila neste ambiente (sm_75<sm_80, CUDA 12.1<13.3, Windows)."
license = "MIT OR Apache-2.0"

[features]
# Track real Tile (rec. NVIDIA): NVIDIA cutile — crates.io `cutile` v0.2 (early-stage,
# exige CUDA 13.3+ e sm_80+ em Linux). Off por default; nunca ativada neste ambiente.
tile = ["dep:cutile"]
# Track real SIMT (NVIDIA cuda-oxide) — NÃO consumível como dependência Cargo
# (precisa cargo-oxide + nightly pinado + LLVM). Mantida vazia por honestidade:
# a porta real exige toolchain própria, fora do escopo do crate.
simt = []

[dependencies]
# Única dependência externa declarada (opcional, feature `tile`): a track real
# da pilha GPU da NVIDIA. Não compila neste ambiente — documentada, nunca ativada.
cutile = { version = "0.2", optional = true }

[dev-dependencies]
# Ponte FFI ao kernel Lean — usada APENAS pelo teste de integração (paridade
# núcleo↔Rust dos invariantes I536/I537/I538 contra o kernel real).
arkhe-lean-bridge = { path = "../arkhe-lean-bridge" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

# Razões do design (devido rigor e honestidade):
#  - A governança NÃO toca hardware: decide sobre LANÇAMENTOS (geometria G-07 e
#    duração nas capas Tile/SIMT) e a auditoria registra só quando autorizado
#    (I536/I537/I538). O hardware é uma track opcional (`tile`/`simt`) que não
#    compila neste ambiente — mas a banda e a contabilidade são reais e
#    formalizadas no núcleo Lean core (sem Mathlib, sem `sorry`).
#  - O núcleo I536A..D/I537A..B/I538A espelha este crate 1:1 no texto que o
#    kernel aceitou; o teste FFI fecha a paridade contra o kernel real.
#  - Sem crate fictício: os alvos criados nos pareceres v520.0/v521.0/v605.0
#    (bloco 1045, I647–I650, `arkhe-gpu` com API lazy) NÃO existiam no
#    monorepo — este crate é o substrato real decidido aqui.
#  - Zero `unsafe` (unsafe_code = deny); zero dependências externas novas no
#    core (Simplicity-2).