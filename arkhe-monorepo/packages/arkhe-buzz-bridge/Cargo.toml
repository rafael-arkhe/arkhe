[package]
name = "arkhe-buzz-bridge"
version = "0.1.0"
edition = "2021"
description = "ARKHE Fountain Protocol <-> Buzz (Nostr) bridge — evidence transport with Z0-Z3 firewall validation"
license = "MIT OR Apache-2.0"

[dependencies]
nostr-sdk = { version = "0.31", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
rand = "0.8"
sha3 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"

[lints.rust]
unsafe_code = "deny"
