name = "arkhe_smeasure"
defaultTargets = ["SMeasureCore"]

# Mathlib is required by path to the prebuilt checkout in the sibling
# lean-llm-agi workspace (all oleans already cached, so this builds offline).
# Transitive deps come from Mathlib's own manifest.

[[require]]
name = "mathlib"
path = "../../../lean-llm-agi/.lake/packages/mathlib"

[[lean_lib]]
name = "SMeasureCore"
