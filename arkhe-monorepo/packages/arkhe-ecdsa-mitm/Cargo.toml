[package]
name = "arkhe-ecdsa-mitm"
version = "0.1.0"
edition = "2021"
description = "ARKHE ECDSA·MITM — analogia de rotação de fase: o parâmetro CP δ da matriz de mistura de camadas (arkhe-field) age como rotação do digest ECDSA; demonstra que rotações de fase são indetectáveis por protocolos cegos à fase e detectáveis por verificações sensíveis."
license = "MIT OR Apache-2.0"

[dependencies]
k256 = { version = "0.13", features = ["ecdsa", "std"] }
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
rand = "0.8"

[lints.rust]
unsafe_code = "deny"