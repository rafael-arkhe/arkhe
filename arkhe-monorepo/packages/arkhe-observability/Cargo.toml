[package]
name = "arkhe-observability"
version = "0.1.0"
edition = "2021"
description = "ARKHE Observatory — bridges the Safe-Core anti-hallucination policy (491-AGI-CORTEX) into the Telegraph ξM-field bus so the Chladni Cloud / Cathedral v26.5 dashboard renders the collar state in real time"
license = "MIT OR Apache-2.0"

[dependencies]
arkhe-recurrency = { path = "../arkhe-recurrency" }
arkhe-recurrency-daemon = { path = "../arkhe-recurrency-daemon" }
arkhe-safe-core = { path = "../../services/safe-core" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
sha3 = "0.10"
sha2 = "0.10"

[lints.rust]
# The TPM (NCrypt) bridge in `src/tpm.rs` requires `unsafe` FFI; each block
# is documented and confined to that module — which locally allows
# `unsafe_code`. Everywhere else in this crate, `unsafe` is forbidden:
# any new unsafe outside tpm.rs fails the build.
unsafe_code = "deny"