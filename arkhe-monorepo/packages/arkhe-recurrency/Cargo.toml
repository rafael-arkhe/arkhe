[package]
name = "arkhe-recurrency"
version = "0.1.0"
edition = "2021"
description = "ARKHE Recurrency (491-AGI-CORTEX) — functional simulation of 4-level recurrency (cellular/local/global/lateral) with two-pass predictive loops, causal-closure measurement and gated global access"
license = "MIT OR Apache-2.0"

[dependencies]
arkhe-neurogenesis = { path = "../arkhe-neurogenesis" }
nalgebra = { version = "0.32", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
anyhow = "1"

[lints.rust]
unsafe_code = "deny"
