[package]
name = "arkhe-epistemic"
version = "0.1.0"
edition = "2021"
description = "Módulo epistémico do ARKHE — verificação aritmética e ponte Lean"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
num-bigint = "0.4"
num-traits = "0.2"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
