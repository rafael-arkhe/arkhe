\* ----------------------------------------------------------------
\* ArkheCoherenceLedger.cfg - configuracao TLC (v376.1, bloco 1000).
\*
\* Instância mínima e exaustiva: PhiMax pequeno (domínio de payload) e
\* poucas janelas — state space ~ O(PhiMax ^ MaxWindows), pequeno para
\* TLC exaustivo neste horizonte. Para a banda real completa (phi x10^4,
\* dezenas de janelas), usar Apalache (symbolic) ou amostragem TLC; a
\* PROPRIEDADE verificada não depende da escala do payload.
\*
\* Para rodar:
\*   java -jar tla2tools.jar -config ArkheCoherenceLedger.cfg \
\*        ArkheCoherenceLedger.tla
\* ----------------------------------------------------------------
SPECIFICATION Spec

CONSTANTS
  PhiMax = 2
  MaxWindows = 4
  GenesisWindow = 0

INVARIANT TypeOK
INVARIANT Gravity1Inv
INVARIANT Loopseal2Inv
INVARIANT GenesisAnchoredInv
INVARIANT UniqueWindowsInv
INVARIANT HashTagsDistinctInv

PROPERTY Liveness