# arkhe-spectral/Cargo.toml
[workspace]
resolver = "2"
members = [
    "crates/spectral-core",
    "crates/concept-pca",
    "crates/signature-audit",
]

[workspace.package]
version = "4.2.2"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1