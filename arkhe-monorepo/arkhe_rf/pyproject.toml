[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arkhe-rf"
version = "0.3.0"
description = "ARKHE RF/ELF — observatório multi-domínio: captura, Doppler, Schumann, anomalias temporais, caminho quântico paralelo (Fase 1–3)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]
[project.optional-dependencies]
soapy = ["SoapySDR>=0.8"]
serial = ["pyserial>=3.5"]
gps = ["gps>=3.0"]
ml = ["torch>=2.0"]
quantum = ["qiskit>=2.0", "scikit-learn>=1.3"]
dashboard = ["streamlit>=1.30"]
dev = ["pytest>=8.0", "ruff>=0.4"]
scripts = []
[tool.setuptools]
packages = ["arkhe_rf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"