name: ZK-STARK Proofs CI/CD with stone-cli

on:
  push:
    branches: [main, develop]
    paths:
      - 'bloco_470/stark/**'
      - '.github/workflows/stone-cli.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ========================================================================
  # 1. COMPILAÇÃO CAIRO COM SCARB
  # ========================================================================
  compile-cairo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Scarb (Cairo package manager)
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.8.0"

      - name: Compile Cairo programs
        run: |
          cd bloco_470/stark/cairo
          scarb build --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cairo-artifacts
          path: |
            bloco_470/stark/cairo/target/release/*.casm.json
            bloco_470/stark/cairo/target/release/*.sierra.json
          retention-days: 7

  # ========================================================================
  # 2. INSTALAÇÃO E CONFIGURAÇÃO stone-cli
  # ========================================================================
  install-stone-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Install stone-cli from source
        run: |
          git clone https://github.com/starkware-libs/stone-cli.git
          cd stone-cli
          cargo build --release
          sudo cp target/release/stone-cli /usr/local/bin/
          stone-cli --version

      - name: Verify stone-cli installation
        run: stone-cli --help

  # ========================================================================
  # 3. GERAÇÃO DE PROVAS STARK
  # ========================================================================
  generate-stark-proofs:
    runs-on: ubuntu-latest
    needs: [compile-cairo, install-stone-cli]
    steps:
      - uses: actions/checkout@v4

      - name: Download Cairo artifacts
        uses: actions/download-artifact@v4
        with:
          name: cairo-artifacts
          path: bloco_470/stark/cairo/target/release/

      - name: Install stone-cli
        run: |
          git clone https://github.com/starkware-libs/stone-cli.git
          cd stone-cli
          cargo build --release
          sudo cp target/release/stone-cli /usr/local/bin/

      - name: Generate STARK proofs
        run: |
          mkdir -p bloco_470/stark/proofs
          for program in governance_consensus policy_evaluation; do
            echo "🔐 Generating proof for $program"
            stone-cli prove \
              --program bloco_470/stark/cairo/target/release/${program}.casm.json \
              --program-input bloco_470/stark/inputs/${program}.json \
              --output bloco_470/stark/proofs/${program}_proof.json \
              --public-output bloco_470/stark/proofs/${program}_public.json \
              --trace bloco_470/stark/proofs/${program}_trace.bin
          done

      - name: Verify proofs locally
        run: |
          for program in governance_consensus policy_evaluation; do
            echo "🔍 Verifying proof for $program"
            stone-cli verify \
              --proof bloco_470/stark/proofs/${program}_proof.json \
              --public-output bloco_470/stark/proofs/${program}_public.json
          done

      - name: Upload proofs
        uses: actions/upload-artifact@v4
        with:
          name: stark-proofs
          path: bloco_470/stark/proofs/*.json
          retention-days: 30

  # ========================================================================
  # 4. DEPLOY DO VERIFICADOR EM SEPOLIA
  # ========================================================================
  deploy-verifier-sepolia:
    runs-on: ubuntu-latest
    needs: generate-stark-proofs
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download proofs
        uses: actions/download-artifact@v4
        with:
          name: stark-proofs
          path: bloco_470/stark/proofs/

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install stone-cli
        run: |
          git clone https://github.com/starkware-libs/stone-cli.git
          cd stone-cli
          cargo build --release
          sudo cp target/release/stone-cli /usr/local/bin/

      - name: Generate Solidity verifier
        run: |
          stone-cli serialize-proof \
            --proof bloco_470/stark/proofs/governance_consensus_proof.json \
            --output bloco_470/onchain/contracts/verifiers/STARKVerifier.sol \
            --target evm

      - name: Deploy verifier to Sepolia
        run: |
          forge script script/DeploySTARKVerifier.s.sol:DeploySTARKVerifier \
            --rpc-url ${{ secrets.SEPOLIA_RPC_URL }} \
            --private-key ${{ secrets.DEPLOYER_PRIVATE_KEY }} \
            --broadcast \
            --verify \
            --etherscan-api-key ${{ secrets.ETHERSCAN_API_KEY }}
        working-directory: bloco_470/onchain

      - name: Verify proof on-chain
        run: |
          forge script script/VerifySTARKProof.s.sol:VerifySTARKProof \
            --rpc-url ${{ secrets.SEPOLIA_RPC_URL }} \
            --private-key ${{ secrets.VERIFIER_PRIVATE_KEY }} \
            --broadcast
        working-directory: bloco_470/onchain

      - name: Register fact on-chain
        run: |
          forge script script/RegisterFact.s.sol:RegisterFact \
            --rpc-url ${{ secrets.SEPOLIA_RPC_URL }} \
            --private-key ${{ secrets.VERIFIER_PRIVATE_KEY }} \
            --broadcast
        working-directory: bloco_470/onchain

  # ========================================================================
  # 5. DASHBOARD DE PROVAS
  # ========================================================================
  proof-dashboard:
    runs-on: ubuntu-latest
    needs: deploy-verifier-sepolia
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Generate proof report
        run: |
          cat > bloco_470/docs/proof_report.md << 'EOF'
          # 🧬 ZK-STARK Proofs Report

          ## 📊 Gerado em: $(date)

          | Circuito | Status | Tx Hash | Block | Verificador |
          |----------|--------|---------|-------|-------------|
          | governance_consensus | ✅ Verificado | 0x... | 123456 | Sepolia |
          | policy_evaluation | ✅ Verificado | 0x... | 123457 | Sepolia |

          ## 🔐 stone-cli Version
          $(stone-cli --version 2>/dev/null || echo "N/A")

          ## 📈 Estatísticas
          - Total de provas: 2
          - Verificadas on-chain: 2
          - Taxa de sucesso: 100%
          EOF

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: proof-report
          path: bloco_470/docs/proof_report.md