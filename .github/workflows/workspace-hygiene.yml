# .github/workflows/workspace-hygiene.yml — guard de integridade (bloco 1078, 2026-09-12)
# Contrato explícito (auditoria 0c1ffd8): .github/workspace-hygiene-expected.txt
# lista os membros declarados em arkhe-monorepo/Cargo.toml que NAO estao
# commitados (dívida conhecida). O checker falha SOMENTE em desvio do contrato:
#   - membro ausente que nao consta no ficheiro  => regressao (vermelho)
#   - membro do ficheiro que ja foi commitado    => exigencia de limpar a linha
#   - dívida == contrato (estado atual: 22)      => verde, com a dívida visivel
#   - ambos vazios                               => smoke cargo metadata, verde
name: Workspace Hygiene (fresh checkout)

on:
  push:
    paths:
      - "arkhe-monorepo/Cargo.toml"
      - "arkhe-monorepo/Cargo.lock"
      - ".github/workflows/workspace-hygiene.yml"
      - ".github/workspace-hygiene-expected.txt"
      - "tools/scripts/check_workspace_hygiene.py"
  pull_request:
    paths:
      - "arkhe-monorepo/Cargo.toml"
      - "arkhe-monorepo/Cargo.lock"
      - ".github/workflows/workspace-hygiene.yml"
      - ".github/workspace-hygiene-expected.txt"
      - "tools/scripts/check_workspace_hygiene.py"

jobs:
  members-exist:
    name: Declared members must match committed-tree contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workspace hygiene checker
        run: |
          python3 tools/scripts/check_workspace_hygiene.py