# Full-workspace CI for safe-core-monorepo — the general-purpose gate.
#
# `web3-security.yml` and `agent-vm.yml` predate most of this workspace's
# current crates and only run `cargo test` for the specific crates they
# were each written for (arkhe-crypto-pqc/arkhe-web3-security,
# arkhe-agent-vm) — every crate added since (arkhe-reasoning,
# arkhe-evidence, arkhe-network, arkhe-storage, arkhe-nostr-anchor,
# arkhe-blossom, arkhe-health-check, arkhe-rsi, arkhe-rsi-core, ...) has
# had `cargo check --workspace` cover it but never actually had its own
# tests run in CI. This workflow closes that gap by running the whole
# workspace's test suite (`--workspace`) instead of a hand-maintained
# per-crate list, so a newly added crate is covered automatically, not
# only once someone remembers to add a line here.
#
# Two known-failing tests are expected and explicitly not a CI failure
# signal here: `arkhe-session-evaluator`'s `detects_validation` and
# `validation_detection_works` are pre-existing failures unrelated to any
# work in this workspace (see docs/verification/README.md) — excluded via
# `--exclude arkhe-session-evaluator` rather than accepting a red build
# for a known, disclosed, unrelated issue. `eval-fixture`'s "unclosed
# delimiter" build errors are not real failures either — they're
# `arkhe-rsi`'s own deliberately-broken fixture code, exercised on purpose
# by its evaluator tests; `--workspace` naturally includes them and they
# do not affect the exit code of the crates that intentionally trigger
# them.
name: Safe Core Monorepo CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  workspace-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safe-core-monorepo
    steps:
      - uses: actions/checkout@v4
      # `setup-rust-toolchain` exporta CARGO_BUILD_WARNINGS com o default
      # 1.97 (o `stable` aqui e' 1.98.1): qualquer lint warning de um crate
      # local passa a ser erro. O workspace tem warnings de `missing_docs`
      # pre-existentes (arkhe-core: 20, em lib.rs:12-13, error.rs:13-31,
      # safety.rs:38, memory_traits.rs), portanto `cargo check --workspace`
      # saia com exit 101 antes de olhar para o resto do workspace — reproduzido
      # localmente em 1.98.1 (e nao em 1.94, que ignora a chave). `warn` mantem
      # os warnings visiveis e tira-lhes o caracter fatal.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # O action define RUSTFLAGS=-D warnings por omissao. O workspace tem
          # 20 avisos de missing_docs; com -D warnings viram erro e o check para
          # (exit 101, reproduzido localmente). Vazio devolve o normal.
          rustflags: ""
      - run: rustup target add wasm32-wasip1
      - run: cargo check --workspace
        env:
          # O action escreve CARGO_BUILD_WARNINGS=deny no $GITHUB_ENV, e isso
          CARGO_BUILD_WARNINGS: warn
      - run: cargo test --workspace --exclude arkhe-session-evaluator --no-fail-fast
