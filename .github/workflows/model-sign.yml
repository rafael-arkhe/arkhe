# Assina e ancora o arkhe.gguf com Sigstore keyless, e produz o bundle companheiro.
#
# O artefacto vem do Hugging Face, não do git e não de uma release:
#   https://huggingface.co/arkhe-os/arkhe resolve o ficheiro por URL estável,
#   sem conta, e publica o SHA-256 no cabeçalho X-Linked-ETag. Verificar antes de
#   assinar é o ponto todo -- verificar depois não verifica nada.
#
# Invocação da CLI, medida em 2026-09-15 contra o `model_signing` instalado:
#   model_signing sign sigstore <MODEL_PATH>   -- forma explícita, usada aqui
#   model_signing sign <MODEL_PATH>            -- também funciona: o método tem
#                                                 `sigstore` por omissão
# `sigstore` é um posicional; a linha de uso sugere que é opcional, e a execução
# confirma que o é. Vai explícito para não depender disso.
#
# O gatilho `push` sobre este ficheiro é PROVISÓRIO: existe para a primeira
# execução acontecer sem que ninguém tenha de criar uma release ou disparar o
# workflow à mão. Remover quando a cadeia estiver provada.
#
# Lembrar: o `arkhe.gguf` publicado fica INALTERADO. O bundle é um ficheiro ao
# lado. É por isso que o schema é v1.4 e não v1.3.
name: Model Sign & Anchor

on:
  release:
    types: [published]
  push:
    paths:
      - '.github/workflows/model-sign.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # sigstore keyless: só este job precisa de um token OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar o model-signing
        run: pip install model-signing

      - name: Descarregar o arkhe.gguf do Hugging Face
        run: |
          mkdir -p model
          cd model
          URL=https://huggingface.co/arkhe-os/arkhe/resolve/main/arkhe.gguf
          # O hub publica o sha256 do ficheiro no cabeçalho; confirmá-lo aqui é a
          # verificação de origem, antes de gastar uma transferência de 1,5 GB.
          ETAG=$(curl -sSIL -A arkhe-ci "$URL" | tr -d '\r' | awk -F'"' '/[Xx]-[Ll]inked-[Ee][Tt]ag/{print $2}')
          echo "X-Linked-ETag da origem: $ETAG"
          curl -sSL -A arkhe-ci -o arkhe.gguf "$URL"
          ls -l arkhe.gguf

      - name: Verificar o SHA-256 antes de assinar
        run: |
          cd model
          # Este valor é o que o ficheiro tem hoje. Devia passar a variável de
          # repositório quando o artefacto for reconstruído; enquanto for o mesmo
          # ficheiro, o literal é a referência mais honesta que existe.
          EXPECTED=10bf45ab933af59e501b9fa63a0a8a1d26a9ec15adf2f13f7dfbe567dbc07708
          ACTUAL=$(sha256sum arkhe.gguf | cut -d' ' -f1)
          echo "esperado: $EXPECTED"
          echo "obtido:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::SHA-256 nao corresponde. Nada sera assinado."
            exit 1
          fi
          echo "SHA-256 verificado: $ACTUAL"

      - name: Assinar com Sigstore keyless (OIDC do GitHub)
        run: |
          cd model
          model_signing sign sigstore arkhe.gguf --signature arkhe.gguf.sig
          ls -l arkhe.gguf.sig

      - name: Verificar o roundtrip
        run: |
          cd model
          model_signing verify sigstore arkhe.gguf \
            --signature arkhe.gguf.sig \
            --identity "${{ github.workflow_ref }}" \
            --identity-provider "https://token.actions.githubusercontent.com"

      - name: Publicar o bundle
        uses: actions/upload-artifact@v4
        with:
          name: arkhe-gguf-bundle
          path: model/arkhe.gguf.sig
          retention-days: 90

      # O passo seguinte seguiria assim que existir um segredo HF_TOKEN no
      # repositório. O bundle é um ficheiro ao lado do modelo, e o
      # `anchored.bundle_uri` dentro do GGUF já aponta para ele.
      #
      # - name: Publicar o bundle ao lado do modelo
      #   env:
      #     HF_TOKEN: ${{ secrets.HF_TOKEN }}
      #   run: |
      #     pip install huggingface_hub
      #     python -c "from huggingface_hub import HfApi; \
      #       HfApi().upload_file(path_or_fileobj='model/arkhe.gguf.sig', \
      #         path_in_repo='arkhe.gguf.sig', repo_id='arkhe-os/arkhe')"

      - name: Resumo
        run: |
          {
            echo "## Modelo assinado"
            echo ""
            echo "- origem: huggingface.co/arkhe-os/arkhe"
            echo "- sha256 verificado: 10bf45ab933af59e501b9fa63a0a8a1d26a9ec15adf2f13f7dfbe567dbc07708"
            echo "- bundle: arkhe.gguf.sig (artefacto da execucao)"
            echo "- identidade: ${{ github.workflow_ref }}"
            echo ""
            echo "O arkhe.gguf publicado NAO foi alterado. O bundle vive ao lado dele."
          } >> "$GITHUB_STEP_SUMMARY"
