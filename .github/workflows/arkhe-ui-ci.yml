# Este workflow vive na RAIZ do repositório, e não em `arkhe-ui/.github/`.
# O GitHub só lê `.github/workflows/` na raiz: uma cópia aninhada nunca corre.
# Esta já viveu em `arkhe-ui/.github/workflows/ci.yml` e nunca foi executada.
# O filtro `paths:` é relativo à raiz; o job trabalha em `arkhe-ui/` via
# `defaults.run.working-directory`.
name: arkhe-ui CI

on:
  push:
    paths:
      - 'arkhe-ui/**'
      - '.github/workflows/arkhe-ui-ci.yml'
  pull_request:
    paths:
      - 'arkhe-ui/**'

defaults:
  run:
    working-directory: arkhe-ui

jobs:
  verify:
    name: typecheck · unit · a11y · e2e · visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: 'npm'
          cache-dependency-path: arkhe-ui/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # O arkhe-ui importa o artefacto wasm-bindgen de
      # safe-core-monorepo/crates/arkhe-verify-wasm/pkg-web, que e saida de
      # build e nao entra no git. Sem o construir primeiro, o typecheck
      # falha com TS2307. Comando conforme src/app/verify-adapter.ts:14.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # A CLI do wasm-bindgen tem de ter *exactamente* a versao que o crate
      # resolveu: o schema do bindgen embutido no .wasm e o da CLI tem de bater,
      # senao `wasm-bindgen` sai com exit 1 ("rust Wasm file schema version:
      # 0.2.126 / this binary schema version: 0.2.114 ... must exactly match").
      # Um pin fixo nao pode estar certo aqui: o Cargo.lock de
      # safe-core-monorepo nao esta' rastreado (regra global `Cargo.lock`), o
      # runner resolve `wasm-bindgen = "0.2"` na versao mais recente publicada
      # (0.2.128, 2026-09-04) e o lock local fixa outra (0.2.126). Derivar a
      # versao da propria arvore de dependencias mantem os dois lados iguais por
      # construcao — e a CLI e' publicada em lockstep com a lib (mesmas versoes
      # em crates.io), portanto a versao derivada existe sempre.
      - name: wasm-bindgen-cli, na versao que o crate resolveu
        working-directory: safe-core-monorepo
        run: |
          WB=$(cargo tree -p arkhe-verify-wasm -i wasm-bindgen \
                 | sed -n 's/^wasm-bindgen v\([0-9.]*\).*/\1/p' | head -1)
          echo "wasm-bindgen resolvido: $WB"
          cargo install wasm-bindgen-cli --version "$WB" --locked

      - name: Construir o artefacto WASM que o arkhe-ui importa
        working-directory: safe-core-monorepo
        run: |
          cargo build --release --target wasm32-unknown-unknown -p arkhe-verify-wasm
          wasm-bindgen --target web --out-dir crates/arkhe-verify-wasm/pkg-web \
            target/wasm32-unknown-unknown/release/arkhe_verify_wasm.wasm

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes unitários + cobertura
        run: npx vitest run --coverage

      # Testes de stories via @storybook/addon-vitest — BLOQUEADO.
      # `@storybook/addon-vitest@10.6.0` declara peer `vitest: ^3.0.0 || ^4.0.0`,
      # incompatível com o pin `vitest@5.0.0` (npm install → ERESOLVE).
      # Além disso exige `@vitest/browser` + browsers do Playwright.
      # Reactivar quando o Storybook suportar vitest 5. Ver README.
      #
      # - name: Testes de stories (addon-vitest)
      #   run: npx vitest run --project=storybook

      - name: Instalar browsers do Playwright
        run: npx playwright install --with-deps

      - name: Testes e2e
        run: npx playwright test

      # Não-bloqueante: requer uma conta Chromatic e o segredo CHROMATIC_TOKEN.
      # Sem conta este passo falha, e o job nasceria vermelho por uma razão que
      # nada tem a ver com o código. Quando a conta existir, retirar a linha abaixo.
      - name: Chromatic
        run: npx chromatic --project-token=${{ secrets.CHROMATIC_TOKEN }}
        continue-on-error: true
