# .github/workflows/ledger-golden.yml — v0.3.3 (corrigendum 3)
# Realocado para .github/workflows/ raiz do repo (GitHub Actions só descobre workflows no root).
# Relativo a arkhe-monorepo/, paths incluem prefixo arkhe-monorepo/.
# arkhe-core agora é workspace standalone (erratum bloco 1077): o workspace
# arkhe-monorepo commitado referencia 22 crates não commitados e não resolve em
# CI; os testes rodam via --manifest-path packages/arkhe-core/Cargo.toml com
# Cargo.lock próprio do crate (--locked).
# Golden vectors cross-platform do ledger (Ghost-1 determinismo).
# Se qualquer target divergir dos valores fixados em golden_vectors,
# o PR é bloqueado antes do merge.
# Metadados (rustc + endianness) são registrados como artefato.
# Corrigendum 3 (bloco 1078, 2026-09-12): aarch64_be-unknown-linux-gnu
# REMOVIDO do matrix — tier-3, não listado pelo rustup no stable 1.94.0
# (verificado localmente; step "Install Rust" falhava antes de qualquer
# teste). Re-habilitar em promoção tier-2 ou via zigbuild/qemu.
name: Ledger Golden Vectors

on:
  push:
    paths:
      - "arkhe-monorepo/packages/arkhe-core/src/ledger.rs"
      - "arkhe-monorepo/packages/arkhe-core/tests/golden_vectors.rs"
      - "arkhe-monorepo/packages/arkhe-core/Cargo.toml"
      - "arkhe-monorepo/packages/arkhe-core/Cargo.lock"
      - ".github/workflows/ledger-golden.yml"
  pull_request:
    paths:
      - "arkhe-monorepo/packages/arkhe-core/src/ledger.rs"

jobs:
  golden:
    name: Golden vectors on ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue_on_error || false }}
    defaults:
      run:
        working-directory: arkhe-monorepo
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - os: macos-14
            target: aarch64-apple-darwin
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (aarch64-linux only)
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run golden vector tests (native)
        if: ${{ !matrix.use_cross }}
        run: cargo test --locked --manifest-path packages/arkhe-core/Cargo.toml golden_vector -- --test-threads=1

      - name: Run golden vector tests (cross)
        if: matrix.use_cross
        run: cross test --locked --manifest-path packages/arkhe-core/Cargo.toml --target ${{ matrix.target }} golden_vector -- --test-threads=1

      - name: Capture platform metadata
        if: always()
        run: |
          echo "target=${{ matrix.target }}" >> platform_meta.txt
          rustc --version >> platform_meta.txt
          echo "endianness=little" >> platform_meta.txt

      - name: Upload platform metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-meta-${{ matrix.target }}
          path: platform_meta.txt

      - name: Fail if any platform diverges
        if: failure() && !matrix.continue_on_error
        run: |
          echo "::error::Golden vector regression detected on ${{ matrix.target }}"
          echo "The BLAKE3 hash of the canonical 95-byte encoding differs from the captured value."
          echo "Possible causes:"
          echo "  - endianness change in to_le_bytes()"
          echo "  - field order change in encode()"
          echo "  - event_kind width change"
          echo "  - Rust/blake3 version change (see platform-meta artifact)"
          exit 1

# Corrigendum 3 (bloco 1078, 2026-09-12): aarch64_be-unknown-linux-gnu
# foi REMOVIDO do matrix. Evidência: `rustup target list` no stable 1.94.0
# não contém nenhum aarch64_be — o target é tier-3 e não instalável no
# stable; o job sempre falhava no step "Install Rust" antes de qualquer
# teste. O layout de 95 bytes NÃO depende de endianness do host:
# ledger.rs usa to_le_bytes() explícito (linha 111) e as_bytes() só sobre
# &str/hashes; BLAKE3 é determinístico em little-endian. Re-habilitar em
# promoção tier-2 ou via cargo-zigbuild/qemu (big-endian permanece como
# dívida de cobertura, registrada no erratum).
# Guard de integridade do workspace: .github/workflows/workspace-hygiene.yml