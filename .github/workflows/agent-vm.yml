# CI for crates/arkhe-agent-vm (in safe-core-monorepo) plus its
# formal-verification artifacts. Separate from web3-security.yml since this
# is a different crate with its own dependency set (arkhe-agi,
# arkhe-inference, arkhe-crypto-pqc, arkhe-identity, arkhe-web3-security).
#
# Both jobs mirror commands actually run locally, not just written and
# hoped to work: rust-build-test = cargo test -p arkhe-agent-vm (34/34
# passing); lean-check = lake build against elan-installed
# leanprover/lean4:v4.31.0 (5/5 jobs, exit 0 — after fixing two real bugs
# the builds caught, see proofs/lean/README.md). Logs in
# safe-core-monorepo/docs/verification/.
name: Agent VM CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  rust-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safe-core-monorepo
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check --workspace
      - run: cargo test -p arkhe-agent-vm

  lean-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safe-core-monorepo/crates/arkhe-agent-vm/proofs/lean
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
