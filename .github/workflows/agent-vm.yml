# CI for crates/arkhe-agent-vm (in safe-core-monorepo) plus its
# formal-verification artifacts. Separate from web3-security.yml since this
# is a different crate with its own dependency set (arkhe-agi,
# arkhe-inference, arkhe-crypto-pqc, arkhe-identity, arkhe-web3-security).
#
# Both jobs mirror commands actually run locally, not just written and
# hoped to work: rust-build-test = cargo test -p arkhe-agent-vm (34/34
# passing); lean-check = lake build against elan-installed
# leanprover/lean4:v4.31.0 (5/5 jobs, exit 0 — after fixing two real bugs
# the builds caught, see proofs/lean/README.md). Logs in
# safe-core-monorepo/docs/verification/.
name: Agent VM CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  rust-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safe-core-monorepo
    steps:
      - uses: actions/checkout@v4
      # Ver o mesmo override em safe-core-monorepo.yml: sem isto o default
      # `missing_docs` que o workspace ja' tinha, e `cargo check --workspace`
      # falhava com exit 101 sem relacao com arkhe-agent-vm.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # O action define RUSTFLAGS=-D warnings por omissao. O workspace tem
          # 20 avisos de missing_docs; com -D warnings viram erro e o check para
          # (exit 101, reproduzido localmente). Vazio devolve o normal.
          rustflags: ""
      - run: cargo check --workspace
        env:
          # O action escreve CARGO_BUILD_WARNINGS=deny no $GITHUB_ENV, e isso
          CARGO_BUILD_WARNINGS: warn
      - run: cargo test -p arkhe-agent-vm

  lean-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safe-core-monorepo/crates/arkhe-agent-vm/proofs/lean
    steps:
      - uses: actions/checkout@v4
      # `defaults.run.working-directory` so' se aplica a passos `run:` — um passo
      # `uses:` nao o herda. O `lean-action` corre `lake build` no seu proprio
      # `lake-package-directory`, que por omissao e' "." (a raiz do repositorio),
      # onde nao existe lakefile nem lean-toolchain: daí o exit 1 neste passo.
      # Medido localmente com o mesmo elan: `lake build` na raiz -> exit 1
      # ("no configuration file with a supported extension"); neste directório
      # -> exit 0 ("Build completed successfully (5 jobs)").
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: safe-core-monorepo/crates/arkhe-agent-vm/proofs/lean
