# .github/workflows/arkhe-crypto-tests.yml — ARKHE-CRYPTO-CODE-TESTABLE-2026-09-12
# Realocado para .github/workflows/ raiz do repo (GitHub Actions so descobre
# workflows no root — precedente erratum bloco 1077, commit 71a1b140).
# Cobertura dos crates criptograficos auditares (plano bloco 1063):
#   packages/arkhe-vss   — Feldman VSS (dealer honesto vs malicioso: verificacao
#                           g^{s_i} = prod C_k^{i^k}, complaints, desqualificacao);
#   packages/arkhe-pacts — BIP-322 prova temporalmente indexada (timestamp de
#                           assinatura, compromisso irrevogavel, nao-transferivel);
#   packages/arkhe-stark — STARK pos-quantico condicional a hash (SHA-256 128 bits
#                           PQ vs SHAKE256 256 bits PQ, validacao de parametros);
#   packages/arkhe-crypto — crate standalone com dkg (falha se disq > t ou
#                           n - disq < t), hash (preimage n/2, collision n/3) e
#                           gate bip322 (FeatureDisabled ate bdk_message_signer
#                           0.2.0 / bdk_wallet 3.1.0 serem ratificados no
#                           workspace; API real corrigida: verify_signed_proof).
# Todas as deps (curve25519-dalek 4.1.3, rand 0.8, sha2 0.10, sha3 0.10,
# thiserror 2.0.20, bitcoin 0.32.102) ja estao no Cargo.lock do workspace — sem
# dependencias externas novas (Simplicity-2). Zero unsafe em cada crate (lints).
# Selo: ARKHE-CRYPTO-CODE-TESTABLE-2026-09-12.
name: ARKHE Crypto Tests

on:
  push:
    paths:
      - "arkhe-monorepo/packages/arkhe-vss/**"
      - "arkhe-monorepo/packages/arkhe-pacts/**"
      - "arkhe-monorepo/packages/arkhe-stark/**"
      - "arkhe-monorepo/packages/arkhe-crypto/**"
      - ".github/workflows/arkhe-crypto-tests.yml"
  pull_request:
    paths:
      - "arkhe-monorepo/packages/arkhe-vss/**"
      - "arkhe-monorepo/packages/arkhe-pacts/**"
      - "arkhe-monorepo/packages/arkhe-stark/**"
      - "arkhe-monorepo/packages/arkhe-crypto/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arkhe-monorepo
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Sem `--offline`: o runner comeca com CARGO_HOME vazio e este job nao tem
      # passo de cache, portanto nao ha registry local de onde tirar as fontes.
      # O Cargo.lock esta' rastreado (as versoes sao as do lock na mesma), mas o
      # lock fixa versoes, nao traz os .crate: `--offline` num runner limpo falha
      # na resolucao ("no matching package named `ml-kem` found ... offline
      # mode", exit 101 — reproduzido com CARGO_HOME vazio).
      - name: Cargo — testes Feldman VSS (honesto/malicioso, 3/3)
        run: cargo test -p arkhe-vss

      - name: Cargo — testes PACTs (BIP-322, 4/4)
        run: cargo test -p arkhe-pacts

      - name: Cargo — testes STARK PQ (4/4)
        run: cargo test -p arkhe-stark

      # O nome tem de ficar entre aspas: um ": " dentro de um scalar simples
      # (o ":" de "8/8:") e' erro de sintaxe YAML, e um ficheiro invalido faz o
      # GitHub criar o run e nao criar job nenhum (o run aparece com o path do
      # ficheiro como nome, sem passos — medido no run 35034915665).
      - name: 'Cargo — testes arkhe-crypto (8/8: 4 dkg + 3 hash + 1 gate bip322 stub)'
        run: cargo test -p arkhe-crypto

      - name: Cargo — clippy all-targets (D warnings) nos quatro crates
        run: cargo clippy -p arkhe-vss -p arkhe-pacts -p arkhe-stark -p arkhe-crypto --all-targets -- -D warnings