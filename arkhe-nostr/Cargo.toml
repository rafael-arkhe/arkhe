[package]
name = "arkhe-nostr"
version = "0.6.0"
edition = "2021"
description = "Nostr-compatible event encoding with Arkhe ML-DSA attestation layer (pure Rust, no C)."
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
arkhe-pqc = { path = "../arkhe-pqc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"