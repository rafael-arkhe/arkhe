# Arkhe Release Policy Configuration
# Requirements: Hermetic build, signed SLSA provenance, canary testing, auto-halt

[policy]
schema_version = "1.0.0"
enforce_fail_closed = true

[release.hermetic]
require_deterministic_build = true
require_clean_git_tree = true
reproducible_build_tool = "reprotest"
sbom_format = "spdx-json"

[release.provenance]
slsa_level = 3
signature_algorithm = "ML-DSA-65"
require_content_hash = true

[release.rollout]
stages = [
    { name = "canary", traffic_pct = 5, duration_minutes = 60, min_success_rate = 99.5 },
    { name = "stage_10", traffic_pct = 10, duration_minutes = 120, min_success_rate = 99.5 },
    { name = "stage_25", traffic_pct = 25, duration_minutes = 240, min_success_rate = 99.8 },
    { name = "stage_50", traffic_pct = 50, duration_minutes = 360, min_success_rate = 99.9 },
    { name = "stage_100", traffic_pct = 100, duration_minutes = 720, min_success_rate = 99.9 }
]

[release.halt_triggers]
max_mmr_divergence = 0
max_invalid_receipts_accepted = 0
max_corrupt_chunks_accepted = 0
max_error_rate_pct = 0.5
auto_halt_enabled = true
auto_rollback_enabled = true
